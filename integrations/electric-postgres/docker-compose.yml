# Real Postgres + real Electric, for the "the Electric adapter is not
# live-service tested" gap the root README admits. Verified by hand against
# this checkout on 2026-08-28: both images pull, the stack comes up healthy,
# and `pnpm demo` runs the live path end to end (see README.md).
#
# `wal_level=logical` is the one Postgres setting Electric actually requires —
# it consumes a logical replication slot, not `pg_notify` or polling.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_fleet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
    ports:
      - "54321:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_fleet"]
      interval: 2s
      timeout: 5s
      retries: 20

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/agent_fleet?sslmode=disable"
      # Dev only — no auth. A production deployment needs Electric's
      # auth/proxy setup instead; not exercised by this demo.
      ELECTRIC_INSECURE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
